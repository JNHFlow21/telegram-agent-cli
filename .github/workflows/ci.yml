name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v

      - name: CLI smoke check (offline, no account)
        env:
          TG_CONFIG_DIR: ${{ runner.temp }}/tg-config
          TG_DATA_DIR: ${{ runner.temp }}/tg-data
        run: |
          python -m telegram_native --version
          python -m telegram_native commands | python -c "import json,sys; e=json.load(sys.stdin); assert e['schema']=='tg.v1' and e['ok'], e"
